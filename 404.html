<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面未找到 | Omiaちゃん的小博客</title>
  <link rel="icon" href="images/misaka.jpg" type="image/jpeg">
  <style>
    :root {
      --hue: 268;
      --accent: oklch(0.62 0.19 var(--hue));
      --accent-soft: oklch(0.62 0.19 var(--hue) / 0.12);
      --card: oklch(0.23 0.02 var(--hue));
      --text: oklch(0.93 0.01 var(--hue));
      --muted: oklch(0.62 0.015 var(--hue));
      --bg: oklch(0.17 0.016 var(--hue));
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
      font-family: 'Inter', 'JetBrains Mono', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    }
    .container {
      text-align: center;
      padding: 46px 40px;
      max-width: 460px;
      background: var(--card);
      border: 1px solid oklch(0.30 0.02 var(--hue));
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }
    h1 {
      font-size: 46px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 10px;
    }
    p { color: var(--muted); font-size: 15px; margin-bottom: 30px; line-height: 1.8; }
    .back-btn {
      display: inline-block;
      padding: 12px 30px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 650;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 2px 12px var(--accent-soft);
    }
    .back-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 22px var(--accent-soft); }
  </style>
</head>

<body>
  <div class="container">
    <h1>404</h1>
    <p>当前页面丢失了喵，可能是被移除或地址有误呢喵~</p>
    <a href="home.html" class="back-btn">返回首页喵~</a>
  </div>
</body>

</html>
